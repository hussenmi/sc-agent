# NAT eval + PROFILER: run scagent on a labeled dataset, score annotation quality
# (ARI/NMI), AND profile workflow runtime / concurrency scaling for the serving
# comparison (vLLM vs NIM vs Nemotron).
#
# Run from the nvidia-nat venv. Use --reps N for the consistency distribution
# (same dataset run N times -> spread of ARI + per-item wall-time):
#   /usersoftware/peerd/ibrahih3/envs/nvidia-nat/bin/nat eval \
#     --config_file /data1/peerd/ibrahih3/cs_agent/nat_integration/configs/annotation_eval_profiled.yml \
#     --reps 3
#
# Backend matrix: change `base_url`/`model` (and output_dir) to point the SAME
# eval at a different serving backend, then compare runtime + accuracy.
#
# IMPORTANT — what the profiler can and cannot see here:
#   scagent runs as ONE opaque subprocess (see workflow.py), so NAT's profiler
#   captures WORKFLOW-LEVEL wall-time per item and concurrency scaling, but NOT
#   per-LLM token counts (scagent doesn't call LLMs through NAT's callbacks).
#   Per-step token/latency detail lives in scagent's own OTel spans -> Phoenix.
#   Token forecasts are therefore left OFF on purpose (would be empty).

general:
  telemetry:
    tracing:
      phoenix:
        _type: phoenix
        endpoint: http://localhost:6006/v1/traces
        project: scagent-nat-eval

workflow:
  _type: scagent_analyze
  scagent_bin: /usersoftware/peerd/ibrahih3/envs/scagent/bin/scagent
  scagent_repo: /data1/peerd/ibrahih3/cs_agent
  provider: openai
  model: Qwen3.6-27B
  base_url: http://localhost:8000/v1
  output_root: /data1/peerd/ibrahih3/cs_agent/nat_runs
  max_iterations: 75
  trace: true
  otlp_endpoint: http://localhost:6006
  trace_project: scagent-nat-eval

eval:
  general:
    output_dir: /data1/peerd/ibrahih3/cs_agent/nat_eval_out_profiled
    # Raise this (e.g. 2-4) for the sizing/concurrency experiment: the profiler's
    # concurrency analysis + runtime forecast model how per-item latency scales
    # with load, which feeds GPU-sizing for "N concurrent scagent users".
    max_concurrency: 1
    dataset:
      _type: jsonl
      file_path: /data1/peerd/ibrahih3/cs_agent/nat_integration/data/annotation_eval_smoke.jsonl
    profiler:
      # Workflow-level timing the opaque subprocess DOES expose to NAT.
      base_metrics: true
      workflow_runtime_forecast: true
      # scagent is opaque to NAT's LLM callbacks -> no per-LLM tokens here.
      compute_llm_metrics: false
      token_usage_forecast: false
      token_uniqueness_forecast: false
      csv_exclude_io_text: true
      bottleneck_analysis:
        enable_nested_stack: true
      concurrency_spike_analysis:
        enable: true
        spike_threshold: 1
  evaluators:
    annotation_ari:
      _type: annotation_ari
      cluster_key: leiden
      fallback_key: cell_type
