# Harness-vs-model test — GLM-5.2 phase.
# Thesis: a well-built agent harness makes the main model matter less. Run the
# SAME scagent workload many times on GLM-5.2 and on Qwen3.6 (luca_eval_qwen.yml),
# compare accuracy band + trajectory consistency.
#
# scagent uses .env with override=True, so BEFORE running set:
#   .env: SCAGENT_MODEL=glm-5.2-fp8  SCAGENT_BASE_URL=http://iscp001:8000/v1
#         SCAGENT_VISION_MODEL/_BASE_URL -> the live VLM NIM
# Run (reps = how many repeats for the consistency band):
#   export WANDB_API_KEY=$(grep ^WANDB_API_KEY= .env | cut -d= -f2- | tr -d '"')
#   /usersoftware/peerd/ibrahih3/envs/nvidia-nat/bin/nat eval \
#     --config_file nat_integration/configs/luca_eval_glm.yml --reps 5

general:
  telemetry:
    tracing:
      weave:
        _type: weave
        project: scagent-nat-glm-postfix

workflow:
  _type: scagent_analyze
  scagent_bin: /usersoftware/peerd/ibrahih3/envs/scagent/bin/scagent
  scagent_repo: /data1/peerd/ibrahih3/cs_agent
  provider: openai
  model: glm-5.2-fp8
  base_url: http://iscp001:8000/v1
  output_root: /data1/peerd/ibrahih3/cs_agent/nat_runs
  max_iterations: 75
  trace: false
  otlp_endpoint: http://localhost:6006
  trace_project: scagent-nat-glm-postfix
  collect_trajectory: true

eval:
  general:
    output_dir: /data1/peerd/ibrahih3/cs_agent/nat_luca_out_glm_postfix
    max_concurrency: 1
    dataset:
      _type: jsonl
      file_path: /data1/peerd/ibrahih3/cs_agent/nat_integration/data/luca_eval.jsonl
    profiler:
      base_metrics: true
      workflow_runtime_forecast: true
      compute_llm_metrics: true
      token_usage_forecast: true
      token_uniqueness_forecast: true
      csv_exclude_io_text: true
      bottleneck_analysis:
        enable_simple_stack: true
        enable_nested_stack: true
      concurrency_spike_analysis:
        enable: true
        spike_threshold: 1
      prefix_span_analysis:
        enable: true
        min_support: 2
  evaluators:
    luca_atlas:
      _type: luca_atlas
      annotation_col: cell_type
      primary_metric: major
