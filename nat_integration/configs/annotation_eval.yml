# NAT eval: run scagent on a labeled dataset and score annotation quality (ARI).
# Run from the nvidia-nat venv:
#   /usersoftware/peerd/ibrahih3/envs/nvidia-nat/bin/nat eval \
#     --config_file /data1/peerd/ibrahih3/cs_agent/nat_integration/configs/annotation_eval.yml
#
# Swap `base_url`/`model` to point the SAME eval at a different serving backend
# (vLLM :8000  ->  NIM :8002  ->  Nemotron ...) to get the speed+accuracy matrix.

workflow:
  _type: scagent_analyze
  scagent_bin: /usersoftware/peerd/ibrahih3/envs/scagent/bin/scagent
  scagent_repo: /data1/peerd/ibrahih3/cs_agent
  provider: openai
  model: Qwen3.6-27B
  base_url: http://localhost:8000/v1
  output_root: /data1/peerd/ibrahih3/cs_agent/nat_runs
  max_iterations: 75

eval:
  general:
    output_dir: /data1/peerd/ibrahih3/cs_agent/nat_eval_out
    max_concurrency: 1
    dataset:
      _type: jsonl
      file_path: /data1/peerd/ibrahih3/cs_agent/nat_integration/data/annotation_eval.jsonl
  evaluators:
    annotation_ari:
      _type: annotation_ari
      cluster_key: leiden
      fallback_key: cell_type
